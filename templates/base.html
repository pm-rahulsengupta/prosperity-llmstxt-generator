<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}llms.txt Generator{% endblock %} &middot; Prosperity</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <!-- Vendored, not CDN-loaded: the container must not need outbound access to
         a third party to render its own UI. -->
    <script src="/static/js/htmx.min.js" defer></script>
</head>
<body>
<header class="top">
    <h1><a href="/">llms.txt Generator</a></h1>
    <span class="sub">Prosperity Media</span>
    <span class="who">
        {% if not llm_enabled %}<span class="pill wait">no LLM key &mdash; heuristics only</span>{% endif %}
        {% if user %}{{ user.email }} &middot; <a href="/logout">sign out</a>{% endif %}
    </span>
</header>
<main>
    {% block content %}{% endblock %}
</main>
</body>
</html>
