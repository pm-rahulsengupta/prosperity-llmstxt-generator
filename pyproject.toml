[project]
name = "prosperity-llmstxt-generator"
version = "0.1.0"
description = "Generates spec-compliant llms.txt and llms-full.txt for client sites."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.121.0",
    "uvicorn[standard]>=0.40.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.20",
    "itsdangerous>=2.2.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.13.0",
    "sqlalchemy>=2.0.44",
    "psycopg[binary,pool]>=3.2.10",
    "alembic>=1.17.0",
    # No `psycopg` extra exists -- procrastinate 3.x uses psycopg 3 as its default
    # connector, and asking for the extra only produces a warning uv prints once and
    # nobody reads.
    "procrastinate>=3.7.0",
    "scrapling[fetchers]>=0.4.14",
    # Main-content extraction, replacing Firecrawl's onlyMainContent. Both are
    # imported directly by app/scrape/extract.py; neither arrives transitively in a
    # form we should rely on, and omitting them broke nothing locally only because
    # scrapling had already pulled lxml into the venv.
    "trafilatura>=2.0.0",
    "lxml>=5.3.0",
    "openai>=2.9.0",
    "authlib>=1.6.5",
    # Password hashing for the bootstrap account. Argon2id is the current OWASP
    # recommendation and argon2-cffi picks sane parameters without being told.
    "argon2-cffi>=23.1.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# `Depends(...)` in a parameter default is FastAPI's dependency-injection idiom,
# not the mutable-default bug B008 exists to catch.
"app/main.py" = ["B008"]
# conftest must set the event-loop policy before anything imports psycopg, so its
# imports cannot all sit at the top.
"tests/conftest.py" = ["E402"]
# The en/em dashes in the link-line regex are deliberate: real files use them as
# the description separator, so the pattern has to contain the actual characters.
"app/core/rules/document.py" = ["RUF001"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
