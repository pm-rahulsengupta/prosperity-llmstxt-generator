[project]
name = "prosperity-llmstxt-generator"
version = "0.1.0"
description = "Generates spec-compliant llms.txt and llms-full.txt for client sites."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.121.0",
    "uvicorn[standard]>=0.40.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.20",
    "itsdangerous>=2.2.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.13.0",
    "sqlalchemy>=2.0.44",
    "psycopg[binary,pool]>=3.2.10",
    "alembic>=1.17.0",
    "procrastinate[psycopg]>=3.7.0",
    "scrapling[fetchers]>=0.4.14",
    "openai>=2.9.0",
    "authlib>=1.6.5",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
